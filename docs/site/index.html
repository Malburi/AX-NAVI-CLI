<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AX Navi 문서</title>
  <meta name="description" content="AX Navi — ITO/SI 조직을 위한 Claude Code 메타 하네스 플러그인 공식 문서">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    /* ---- 토큰: 라이트 기본, 다크는 토큰만 재정의 ---- */
    :root {
      --ground: #F6F7F4;
      --surface: #FFFFFF;
      --surface-2: #EEF1EE;
      --ink: #1B2530;
      --ink-soft: #46535E;
      --muted: #6B7882;
      --line: #D8DEDB;
      --accent: #0F7B85;
      --accent-ink: #0A5C64;
      --accent-soft: #E1F0F1;
      --warn: #B8641E;
      --warn-soft: #F7E9DC;
      --code-bg: #F0F3F1;
      --code-ink: #1B2530;
      --sidebar-bg: #FBFBF9;
      --shadow: 0 1px 2px rgba(27, 37, 48, 0.06);
      --font-display: "Gothic A1", "Noto Sans KR", "Malgun Gothic", sans-serif;
      --font-body: "Noto Sans KR", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", "D2Coding", Consolas, "Courier New", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ground: #0E1418;
        --surface: #151D23;
        --surface-2: #1B252C;
        --ink: #E3E9EC;
        --ink-soft: #B9C4CB;
        --muted: #8E9CA6;
        --line: #26323A;
        --accent: #48B7BF;
        --accent-ink: #7ACFD5;
        --accent-soft: #123338;
        --warn: #E0955A;
        --warn-soft: #3A2A1B;
        --code-bg: #10181D;
        --code-ink: #DCE4E8;
        --sidebar-bg: #111920;
        --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --ground: #0E1418;
      --surface: #151D23;
      --surface-2: #1B252C;
      --ink: #E3E9EC;
      --ink-soft: #B9C4CB;
      --muted: #8E9CA6;
      --line: #26323A;
      --accent: #48B7BF;
      --accent-ink: #7ACFD5;
      --accent-soft: #123338;
      --warn: #E0955A;
      --warn-soft: #3A2A1B;
      --code-bg: #10181D;
      --code-ink: #DCE4E8;
      --sidebar-bg: #111920;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.7;
      word-break: keep-all;
    }
    a { color: var(--accent-ink); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- 사이드바 ---- */
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 288px;
      overflow-y: auto;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      padding: 0 0 40px;
      transition: transform .2s ease;
      z-index: 20;
    }
    .sidebar > h1 {
      margin: 0;
      padding: 22px 22px 14px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      border-bottom: 1px solid var(--line);
    }
    .sidebar > h1 a { color: var(--ink); display: flex; align-items: center; gap: 10px; }
    .sidebar > h1 a::before {
      content: "";
      width: 22px; height: 22px; flex: none;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background:
        linear-gradient(var(--accent), var(--accent)) center/2px 12px no-repeat,
        linear-gradient(var(--accent), var(--accent)) center/12px 2px no-repeat;
    }
    .sidebar .search { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .sidebar .search input {
      width: 100%; padding: 8px 10px;
      font: inherit; font-size: .9rem;
      color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: 6px;
      outline: none;
    }
    .sidebar .search input:focus { border-color: var(--accent); }
    .sidebar .search .results-panel { display: none; }
    .sidebar .search .results-panel.show { display: block; margin-top: 8px; }
    .sidebar .search .matching-post { padding: 8px 4px; border-bottom: 1px solid var(--line); }
    .sidebar .search .matching-post h2 { margin: 0 0 2px; font-size: .9rem; font-weight: 600; }
    .sidebar .search .matching-post p { margin: 0; font-size: .8rem; color: var(--muted); }
    .sidebar .search .search-keyword { color: var(--accent-ink); font-weight: 600; font-style: normal; }
    .sidebar-nav { padding: 10px 12px 0; font-size: .92rem; }
    .sidebar-nav ul { list-style: none; margin: 0; padding: 0; }
    .sidebar-nav > ul > li { margin: 14px 0 4px; }
    .sidebar-nav > ul > li > p, .sidebar-nav > ul > li > strong {
      display: block; margin: 0 0 4px; padding: 0 10px;
      font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted);
    }
    .sidebar-nav li > a {
      display: block; padding: 5px 10px;
      color: var(--ink-soft); border-radius: 5px;
      border-left: 2px solid transparent;
    }
    .sidebar-nav li > a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
    .sidebar-nav li.active > a { color: var(--accent-ink); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 500; }
    .sidebar-nav ul ul { margin-left: 10px; }
    .sidebar-nav ul ul li > a { font-size: .85rem; padding: 3px 10px; color: var(--muted); }
    .sidebar-toggle {
      position: fixed; left: 0; bottom: 0; z-index: 30;
      width: 44px; height: 44px; border: 0; cursor: pointer;
      background: var(--surface); border-top: 1px solid var(--line); border-right: 1px solid var(--line);
      padding: 0;
    }
    .sidebar-toggle span { display: block; width: 18px; height: 2px; margin: 4px auto; background: var(--ink-soft); }

    /* ---- 본문 ---- */
    .content { position: relative; padding-left: 288px; min-height: 100vh; transition: padding-left .2s ease; }
    body.close .sidebar { transform: translateX(-288px); }
    body.close .content { padding-left: 0; }
    .markdown-section {
      max-width: 74ch; margin: 0 auto;
      padding: 56px 40px 96px;
    }
    .markdown-section > :first-child { margin-top: 0; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      font-family: var(--font-display); font-weight: 800; letter-spacing: -0.015em; line-height: 1.3;
      text-wrap: balance; color: var(--ink);
    }
    .markdown-section h1 { font-size: 2rem; margin: 0 0 .6em; }
    .markdown-section h1 + p { font-size: 1.08rem; color: var(--ink-soft); }
    .markdown-section h2 { font-size: 1.35rem; margin: 2.2em 0 .7em; padding-top: .6em; border-top: 1px solid var(--line); }
    .markdown-section h3 { font-size: 1.08rem; margin: 1.8em 0 .5em; }
    .markdown-section h4 { font-size: .95rem; margin: 1.4em 0 .4em; color: var(--ink-soft); }
    .markdown-section p, .markdown-section ul, .markdown-section ol { margin: 0 0 1em; }
    .markdown-section li { margin: .25em 0; }
    .markdown-section blockquote {
      margin: 1.2em 0; padding: .7em 1em;
      border-left: 3px solid var(--accent); background: var(--accent-soft);
      color: var(--ink-soft); border-radius: 0 6px 6px 0;
    }
    .markdown-section blockquote p { margin: 0; }
    .markdown-section code {
      font-family: var(--font-mono); font-size: .86em;
      background: var(--code-bg); color: var(--code-ink);
      padding: .12em .38em; border-radius: 4px;
    }
    .markdown-section pre {
      position: relative;
      margin: 1.2em 0; padding: 14px 16px;
      background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
      overflow-x: auto; line-height: 1.55;
    }
    .markdown-section pre > code { background: none; padding: 0; font-size: .84rem; color: var(--code-ink); white-space: pre; }
    .markdown-section pre.mermaid { background: var(--surface); text-align: center; }
    .markdown-section .table-wrapper { overflow-x: auto; margin: 1.2em 0; }
    .markdown-section table { border-collapse: collapse; width: 100%; font-size: .92rem; font-variant-numeric: tabular-nums; }
    .markdown-section th, .markdown-section td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .markdown-section th { font-weight: 700; color: var(--ink-soft); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; background: var(--surface-2); }
    .markdown-section tr:hover td { background: var(--surface-2); }
    .markdown-section hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
    .markdown-section img { max-width: 100%; }
    .markdown-section strong { font-weight: 700; }
    .markdown-section .anchor span { color: inherit; }
    .markdown-section h2 .anchor:hover::after, .markdown-section h3 .anchor:hover::after { content: " #"; color: var(--muted); font-weight: 400; }

    /* 홈 카드 */
    .home-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 1.4em 0 2em; }
    .home-card { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
    .home-card:hover { border-color: var(--accent); text-decoration: none; }
    .home-card .eyebrow { display: block; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 4px; }
    .home-card strong { display: block; font-family: var(--font-display); font-size: 1.02rem; margin-bottom: 4px; }
    .home-card span.desc { color: var(--muted); font-size: .9rem; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; border: 1px solid var(--line); color: var(--ink-soft); background: var(--surface); }
    .pill.go { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
    .pill.hold { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }

    /* 복사 버튼 (docsify-copy-code) */
    .docsify-copy-code-button { font-family: var(--font-body); font-size: .72rem; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
    .docsify-copy-code-button:hover { color: var(--accent-ink); border-color: var(--accent); }

    /* 페이지네이션 */
    .docsify-pagination-container { border-top: 1px solid var(--line); margin-top: 3em; padding-top: 1.2em; }
    .pagination-item-label { color: var(--muted); font-size: .8rem; }
    .pagination-item-title { color: var(--ink); font-family: var(--font-display); font-weight: 700; }

    .progress { background: var(--accent); }

    @media (max-width: 860px) {
      .sidebar { transform: translateX(-288px); }
      .content { padding-left: 0; }
      body.close .sidebar { transform: none; }
      .markdown-section { padding: 40px 20px 80px; }
      .home-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sidebar, .content { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app">문서를 불러오는 중입니다.</div>
  <script>
    window.$docsify = {
      name: 'AX Navi 문서',
      repo: '',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      executeScript: false,
      relativePath: false,
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '문서 검색',
        noData: '검색 결과가 없습니다.',
        depth: 3,
        hideOtherSidebarContent: false,
      },
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true,
        crossChapterText: true,
      },
      copyCode: { buttonText: '복사', errorText: '실패', successText: '복사됨' },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              var esc = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              return '<pre class="mermaid">' + esc + '</pre>';
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid && document.querySelector('.mermaid')) {
              var dark = document.documentElement.getAttribute('data-theme') === 'dark'
                || (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
              window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'neutral' });
              window.mermaid.run({ querySelector: '.mermaid' });
            }
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</body>
</html>
